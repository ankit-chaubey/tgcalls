[package]
name            = "tgcalls"
version         = "0.2.0-beta2"
edition         = "2021"
authors         = ["Ankit Chaubey <ankitchaubey.dev@gmail.com>"]
license         = "MIT OR Apache-2.0"
description     = "An elegant Rust client for Telegram voice and video calls."
documentation   = "https://docs.rs/tgcalls"
homepage        = "https://github.com/ankit-chaubey/tgcalls"
repository      = "https://github.com/ankit-chaubey/tgcalls"
readme          = "README.md"
keywords        = ["telegram", "tgcalls", "ntgcalls", "webrtc", "voip"]
categories      = ["api-bindings", "multimedia"]

[lib]
name = "tgcalls"
path = "src/lib.rs"

[[example]]
name = "group_audio_call"
path = "examples/group_audio_call.rs"

[[example]]
name = "group_video_call"
path = "examples/group_video_call.rs"

[[example]]
name = "group_av_call"
path = "examples/group_av_call.rs"

[[example]]
name = "group_screen_share"
path = "examples/group_screen_share.rs"

[[example]]
name = "p2p_audio_call"
path = "examples/p2p_audio_call.rs"

[[example]]
name = "p2p_video_call"
path = "examples/p2p_video_call.rs"

[[example]]
name = "graceful_shutdown"
path = "examples/graceful_shutdown.rs"

[[example]]
name = "mute_resume_calls"
path = "examples/mute_resume_calls.rs"

[[example]]
name = "recording_calls"
path = "examples/recording_calls.rs"

[[example]]
name = "queue_calls"
path = "examples/queue_calls.rs"

[[example]]
name = "simple_calls"
path = "examples/simple_calls.rs"

[[example]]
name = "conference_calls"
path = "examples/conference_calls.rs"

[[example]]
name = "conference_calls_managed"
path = "examples/conference_calls_managed.rs"

[dependencies]
ferogram   = "0.6.4"
ntgcalls   = "=3.0.0-beta14"
tokio      = { version = "1", features = ["full"] }
thiserror  = "1"
tracing    = "0.1"
serde_json = "1"
base64     = "0.22"

[dev-dependencies]
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow             = "1"
